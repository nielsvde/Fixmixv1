<script>
  let computedActualTotal = 0;
  let html5QrCode = null;
  let useWaterFlush = false;

  function setWaterFlush(enable) {
    useWaterFlush = enable;
    const elNo = document.getElementById('optNoFlush');
    if (elNo) elNo.classList.toggle('active', !enable);
    const elWith = document.getElementById('optWithFlush');
    if (elWith) elWith.classList.toggle('active', enable);
    calculate();
  }

  function toggleSettings() {
    const password = prompt("Voer het wachtwoord in om de instellingen te openen:");
    if (password === "Fm") {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    } else if (password !== null) {
      alert("Onjuist wachtwoord!");
    }
  }

  function toggleExtraParameters() {
    const container = document.getElementById('extraParametersContainer');
    const btn = document.getElementById('toggleExtraFieldsBtn');
    if (container.style.display === 'none' || container.style.display === '') {
      container.style.display = 'block';
      btn.innerHTML = '<span>➖ Verberg extra parameters</span>';
    } else {
      container.style.display = 'none';
      btn.innerHTML = '<span>➕ Extra parameters (DS, Proteïne, Sacharose)</span>';
      document.getElementById('currentDS').value = '';
      document.getElementById('currentProtein').value = '';
      document.getElementById('currentSucrose').value = '';
      hideTool1Results();
    }
  }

  function hideTool1Results() {
    const resultsWrapper = document.getElementById('resultsTabWrapper');
    if (resultsWrapper) resultsWrapper.style.display = 'none';
  }

  function formatInput(input) {
    if (input.value.includes(',')) {
      const cursorPos = input.selectionStart;
      input.value = input.value.replace(/,/g, '.');
      input.setSelectionRange(cursorPos, cursorPos);
    }
    saveSettings();
  }

  const settingIds = ['facWaterFlush', 'facCreamDS', 'facCreamProtein', 'facYield', 'facWater', 'facEvap', 'facPkgMult', 'facBulkMult'];

  function saveSettings() {
    settingIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) localStorage.setItem(id, el.value);
    });
  }

  function loadSettings() {
    settingIds.forEach(id => {
      const val = localStorage.getItem(id);
      const el = document.getElementById(id);
      if (val !== null && el) el.value = val;
    });
  }

  function formatDecimals(input, decimals) {
    const val = parseNum(input.value);
    if (val > 0) input.value = val.toFixed(decimals);
  }

  function parseNum(val) {
    if (!val) return 0;
    return parseFloat(val.toString().replace(/,/g, '.')) || 0;
  }

  function toggleTooltip(id) {
    const el = document.getElementById(id);
    if (el) {
      if (id === 'expectedValueTooltip') {
        const dsValEl = document.getElementById('tooltipDsVal');
        const facDS = parseNum(document.getElementById('facCreamDS').value) || 10;
        if (dsValEl) dsValEl.innerText = facDS;

        const creamFatVal = parseNum(document.getElementById('creamFat').value) || 42;
        const elFat1 = document.getElementById('tooltipCreamFatVal');
        const elFat2 = document.getElementById('tooltipCreamFatCalcVal');
        const elFat3 = document.getElementById('tooltipCreamFatVal2');
        if (elFat1) elFat1.innerText = creamFatVal;
        if (elFat2) elFat2.innerText = creamFatVal;
        if (elFat3) elFat3.innerText = creamFatVal;
      }
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

  function switchMainTool(toolId, btn) {
    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.main-tool-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(toolId).classList.add('active');

    document.getElementById('settingsPanel').style.display = 'none';
    
    if (toolId !== 'tool3' && html5QrCode) {
      const cameraContainer = document.getElementById('cameraContainer');
      if (cameraContainer && cameraContainer.style.display === 'block') {
        toggleEmbeddedCamera();
      }
    }
  }

  function switchCodeType(type, btn) {
    document.querySelectorAll('.code-type-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.code-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(type === 'qr' ? 'qrSection' : 'barcodeSection').classList.add('active');
  }

  function selectCauseAndProceed(causeValue) {
    const selectEl = document.getElementById('missingComponent');
    if (selectEl) {
      selectEl.value = causeValue;
    }
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('calculatorFormContent').style.display = 'block';
    
    onCauseChange();
    hideTool1Results();
  }

  async function pasteClipboard() {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('codeTextInput').value = text;
          generateCodes();
        }
      } else {
        alert("Klembord toegang wordt niet ondersteund in deze browser.");
      }
    } catch (err) {
      alert("Geen toestemming om het klembord te lezen.");
    }
  }

  function toggleEmbeddedCamera() {
    const cameraContainer = document.getElementById('cameraContainer');
    const scanBtn = document.getElementById('scanBtn');

    if (cameraContainer.style.display === 'block') {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          cameraContainer.style.display = 'none';
          scanBtn.innerText = '📷 Open Live Scanner';
        }).catch(err => console.error(err));
      }
    } else {
      cameraContainer.style.display = 'block';
      scanBtn.innerText = '❌ Sluit Camera';

      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          document.getElementById('codeTextInput').value = decodedText;
          generateCodes();
          toggleEmbeddedCamera();
        },
        () => {}
      ).catch(() => {
        alert("Kan camera niet openen. Controleer camerarechten.");
        cameraContainer.style.display = 'none';
        scanBtn.innerText = '📷 Open Live Scanner';
      });
    }
  }

  function updateDateInformation() {
    const now = new Date();
    const startOfYear = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));
    document.getElementById('julianDayValue').innerText = dayOfYear;

    const futureDate = new Date();
    futureDate.setDate(now.getDate() + 25);
    document.getElementById('futureDateValue').innerText = futureDate.toLocaleDateString('nl-NL', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
  }

  function onCauseChange() {
    const cause = document.getElementById('missingComponent').value;
    const creamFatGroup = document.getElementById('creamFatGroup');
    const currentFatGroup = document.getElementById('currentFatGroup');
    const reprocessGroup = document.getElementById('reprocessFieldsGroup');
    const waterMoreTypeGroup = document.getElementById('waterMoreTypeGroup');
    const unknownTypeGroup = document.getElementById('unknownTypeGroup');
    const addLabel = document.getElementById('addLabel');

    const isReprocess = cause === 'reprocess_missing';
    const isWaterMore = cause === 'water_more';
    const isUnknown = cause === 'unknown';

    const correctiveIngredient = isWaterMore ? document.getElementById('waterMoreCorrectiveIngredient').value : 
                                 (isUnknown ? document.getElementById('unknownCorrectiveIngredient').value : null);

    reprocessGroup.style.display = isReprocess ? 'block' : 'none';
    currentFatGroup.style.display = isReprocess ? 'none' : 'block';
    waterMoreTypeGroup.style.display = isWaterMore ? 'block' : 'none';
    unknownTypeGroup.style.display = isUnknown ? 'block' : 'none';

    let showCreamFat = false;
    if (isReprocess || cause.startsWith('cream')) {
      showCreamFat = true;
    } else if (isWaterMore && correctiveIngredient === 'cream') {
      showCreamFat = true;
    } else if (isUnknown && correctiveIngredient === 'cream') {
      showCreamFat = true;
    }

    creamFatGroup.style.display = showCreamFat ? 'block' : 'none';

    if (cause.startsWith('fat') || (isWaterMore && correctiveIngredient === 'fat') || (isUnknown && correctiveIngredient === 'fat')) {
      addLabel.innerHTML = 'Hoeveelheid vloeibaar vet <strong>toevoegen</strong>:';
    } else if (cause.startsWith('cream') || (isUnknown && correctiveIngredient === 'cream') || (isWaterMore && correctiveIngredient === 'cream')) {
      addLabel.innerHTML = 'Hoeveelheid room <strong>toevoegen</strong>:';
    } else {
      addLabel.innerHTML = 'Hoeveelheid room/vet <strong>toevoegen</strong>:';
    }
  }

  function executeCalculation() {
    setWaterFlush(false);
    document.getElementById('resultsTabWrapper').style.display = 'block';
    calculate();
  }

  function resetCalculator() {
    ['batchSize', 'currentFat', 'targetFat', 'creamFat', 'missingReprocessKg', 'reprocessFat', 'evapInput', 'evapPackagesInput', 'evapReprocessInput', 'codeTextInput', 'currentDS', 'currentProtein', 'currentSucrose'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    document.getElementById('missingComponent').value = 'unknown';
    document.getElementById('waterMoreCorrectiveIngredient').value = 'cream';
    document.getElementById('unknownCorrectiveIngredient').value = 'cream';
    setWaterFlush(false);
    
    document.getElementById('extraParametersContainer').style.display = 'none';
    document.getElementById('toggleExtraFieldsBtn').innerHTML = '<span>➕ Extra parameters (DS, Proteïne, Sacharose)</span>';

    hideTool1Results();
    ['batchTooltip', 'addTooltip', 'evapTooltip', 'diffFatTooltip', 'expectedValueTooltip'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = 'none';
    });
    
    document.getElementById('calculatorFormContent').style.display = 'none';
    document.getElementById('welcomeScreen').style.display = 'block';

    onCauseChange();
    calculateEvap();
    generateCodes();
  }

  function updateExtraParametersResults(actualTotal, currentFatKg, addAmount, waterToAdd, finalTotalBatch, inputDS, inputProtein, inputSucrose, additionType, creamFatVal, targetFatVal) {
    const extraBlock = document.getElementById('extraParametersResultBlock');
    const rowFat = document.getElementById('rowResultFat');
    const rowDS = document.getElementById('rowResultDS');
    const rowProt = document.getElementById('rowResultProtein');
    const rowSuc = document.getElementById('rowResultSucrose');

    if (extraBlock) extraBlock.style.display = 'block';

    if (rowFat) rowFat.style.display = 'flex';
    document.getElementById('resultFatVal').innerText = targetFatVal.toFixed(2) + ' %';

    const facDS = parseNum(document.getElementById('facCreamDS').value) || 10;
    const facProt = parseNum(document.getElementById('facCreamProtein').value) || 4.275;

    const creamDS = additionType === 'cream' ? (creamFatVal + facDS) : 100;
    const creamProt = additionType === 'cream' ? ((100 - creamFatVal) / 100 * facProt) : 0;

    if (inputDS > 0) {
      const initialDSKg = (actualTotal * inputDS) / 100;
      const addedDSKg = (addAmount * creamDS) / 100;
      const finalDS = ((initialDSKg + addedDSKg) / finalTotalBatch) * 100;
      document.getElementById('resultDSVal').innerText = finalDS.toFixed(2) + ' %';
      if (rowDS) rowDS.style.display = 'flex';
    } else {
      if (rowDS) rowDS.style.display = 'none';
    }

    if (inputProtein > 0) {
      const initialProtKg = (actualTotal * inputProtein) / 100;
      const addedProtKg = (addAmount * creamProt) / 100;
      const finalProt = ((initialProtKg + addedProtKg) / finalTotalBatch) * 100;
      document.getElementById('resultProteinVal').innerText = finalProt.toFixed(2) + ' %';
      if (rowProt) rowProt.style.display = 'flex';
    } else {
      if (rowProt) rowProt.style.display = 'none';
    }

    if (inputSucrose > 0) {
      const initialSucKg = (actualTotal * inputSucrose) / 100;
      const finalSuc = (initialSucKg / finalTotalBatch) * 100;
      document.getElementById('resultSucroseVal').innerText = finalSuc.toFixed(2) + ' %';
      if (rowSuc) rowSuc.style.display = 'flex';
    } else {
      if (rowSuc) rowSuc.style.display = 'none';
    }
  }

  function calculateEvap() {
    const rawText = document.getElementById('evapInput').value;
    const matches = rawText.match(/[0-9]+([.,][0-9]+)?/g);
    
    let totalLiters = 0;
    let runCount = rawText.trim() !== '' ? rawText.split(/\r?\n/).filter(line => line.trim() !== '').length : 0;

    if (matches) matches.forEach(m => totalLiters += parseNum(m));

    const fYield = parseNum(document.getElementById('facYield').value) || 1.08;
    const fWater = parseNum(document.getElementById('facWater').value) || 0.01;
    const fEvap = parseNum(document.getElementById('facEvap').value) || 0.99;
    const fPkgMult = parseNum(document.getElementById('facPkgMult').value) || 4;
    const fBulkMult = parseNum(document.getElementById('facBulkMult').value) || 1.1;

    const yieldKg = Math.round(totalLiters * fYield);
    const waterKg = Math.round(yieldKg * fWater);
    const evapKg = Math.round(yieldKg * fEvap);
    
    const packagesVal = parseNum(document.getElementById('evapPackagesInput').value);
    const reprocessVal = parseNum(document.getElementById('evapReprocessInput').value);
    const bulkOrderVal = Math.round((packagesVal * fPkgMult) * fBulkMult + reprocessVal);

    document.getElementById('evapRuns').innerText = runCount;
    document.getElementById('evapTotalLiters').innerText = Math.round(totalLiters).toLocaleString('nl-NL') + ' L';
    document.getElementById('evapYieldKg').innerText = yieldKg.toLocaleString('nl-NL') + ' kg';
    document.getElementById('evapWater').innerText = waterKg.toLocaleString('nl-NL') + ' kg';
    document.getElementById('evapEvap').innerText = evapKg.toLocaleString('nl-NL') + ' kg';
    document.getElementById('evapBulkOrder').innerText = bulkOrderVal.toLocaleString('nl-NL') + ' kg';
  }

  function generateCodes() {
    const val = document.getElementById('codeTextInput').value.trim();
    const qrContainer = document.getElementById('qrContainer');
    const barcodeSvg = document.getElementById('barcodeSvg');
    const barcodePlaceholder = document.getElementById('barcodePlaceholder');

    if (val === '') {
      qrContainer.innerHTML = 'Geen invoer opgegeven';
      barcodeSvg.style.display = 'none';
      barcodePlaceholder.style.display = 'block';
    } else {
      qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(val)}" alt="QR Code">`;

      try {
        barcodeSvg.style.display = 'block';
        barcodePlaceholder.style.display = 'none';
        JsBarcode("#barcodeSvg", val, {
          format: "CODE128", lineColor: "#000", width: 2.5, height: 90, displayValue: true, fontSize: 16, margin: 10
        });
      } catch (e) {
        barcodeSvg.style.display = 'none';
        barcodePlaceholder.style.display = 'block';
        barcodePlaceholder.innerText = 'Tekst niet geschikt voor streepjescode';
      }
    }
  }

  function calculate() {
    const inputBatchSize = parseNum(document.getElementById('batchSize').value);
    const currentFat = parseNum(document.getElementById('currentFat').value);
    const targetFat = parseNum(document.getElementById('targetFat').value);
    const missingComponent = document.getElementById('missingComponent').value;
    const waterMoreIngredient = document.getElementById('waterMoreCorrectiveIngredient').value;
    const unknownIngredient = document.getElementById('unknownCorrectiveIngredient').value;
    const waterFlushKg = parseNum(document.getElementById('facWaterFlush').value) || 0;

    const inputDS = parseNum(document.getElementById('currentDS').value);
    const inputProtein = parseNum(document.getElementById('currentProtein').value);
    const inputSucrose = parseNum(document.getElementById('currentSucrose').value);

    let additionType = 'cream';
    let effectiveCreamFat = parseNum(document.getElementById('creamFat').value);

    if (missingComponent.startsWith('fat') || 
        (missingComponent === 'water_more' && waterMoreIngredient === 'fat') || 
        (missingComponent === 'unknown' && unknownIngredient === 'fat')) { 
      additionType = 'fat'; 
      effectiveCreamFat = 100; 
    } else if (missingComponent.startsWith('water')) { 
      additionType = (missingComponent === 'water_more' && currentFat < targetFat) ? 'cream' : 'water'; 
    }

    const rowAddIngredient = document.getElementById('rowAddIngredient');
    const waterFlushToggleContainer = document.getElementById('waterFlushToggleContainer');
    const rowAddWater = document.getElementById('rowAddWater');
    const unknownCurrentBatchFatBlock = document.getElementById('unknownCurrentBatchFatBlock');
    const holdWaterBlock = document.getElementById('holdWaterBlock');
    const errorSection = document.getElementById('errorSection');
    const actualBatchBlock = document.getElementById('actualBatchBlock');
    const actualBatchDetailsSection = document.getElementById('actualBatchDetailsSection');
    const step2Title = document.getElementById('step2Title');
    const addTooltipText = document.getElementById('addTooltipText');
    const addTooltipIcon = document.getElementById('addTooltipIcon');
    const standardResultsBlock = document.getElementById('standardResultsBlock');

    const isUnknown = missingComponent === 'unknown';
    const isReprocess = missingComponent === 'reprocess_missing';

    // Toon de sectie 1 analyse altijd (ook bij unknown)
    actualBatchBlock.style.display = 'block';
    actualBatchDetailsSection.style.display = 'block';
    step2Title.innerText = '2. Correctieberekening (Stap voor stap)';

    const detailsEl = document.getElementById('actualBatchDetails');
    const actualBatchValueEl = document.getElementById('actualBatchValue');
    let hasError = false;

    if (addTooltipText) {
      if (additionType === 'fat') {
        addTooltipText.innerText = '100% vet: Bulkvet of gesmolten blokken';
      } else {
        addTooltipText.innerText = useWaterFlush 
          ? `Room doseren met ${waterFlushKg} kg waterinspoel.` 
          : '100% room doseren zonder waterinspoel.';
      }
    }

    let missingFields = [];
    if (!inputBatchSize) missingFields.push('Geplande batchgrootte');
    if (!targetFat) missingFields.push('Doel vet');

    if (isReprocess) {
      const missingReprocessKg = parseNum(document.getElementById('missingReprocessKg').value);
      const reprocessFat = parseNum(document.getElementById('reprocessFat').value);
      if (!missingReprocessKg) missingFields.push('Ontbrekende herverwerking (kg)');
      if (!reprocessFat) missingFields.push('Gepland vetgehalte herverwerking');
      if (!effectiveCreamFat) missingFields.push('Vetgehalte beschikbare room');
    } else {
      if (!currentFat) missingFields.push('Gemeten vet');
      const needsCreamFat = missingComponent.startsWith('cream') || 
        (missingComponent === 'unknown' && unknownIngredient === 'cream') || 
        (missingComponent === 'water_more' && waterMoreIngredient === 'cream');
      if (needsCreamFat && !effectiveCreamFat) {
        missingFields.push('Vetgehalte beschikbare room');
      }
    }

    if (missingFields.length > 0) {
      errorSection.innerHTML = `<div class="error-box"><strong>⚠️ Niet alle verplichte velden zijn ingevuld!</strong><br>Vul a.u.b. de volgende gegevens in: <strong>${missingFields.join(', ')}</strong>.</div>`;
      standardResultsBlock.style.display = 'none';
      document.getElementById('standardFatAnalysisBlock').style.display = 'none';
      if (unknownCurrentBatchFatBlock) unknownCurrentBatchFatBlock.style.display = 'none';
      document.getElementById('extraParametersResultBlock').style.display = 'none';
      document.getElementById('calcSteps').innerHTML = '<p style="margin:0; color:#666;">Vul alle vereiste velden in om de stappen te tonen.</p>';
      return;
    }

    let addAmount = 0, waterToAdd = 0, waterToHoldNext = 0, stepsHtml = '';
    const ingredientName = additionType === 'fat' ? 'vloeibaar vet' : 'room';

    if (isReprocess) {
      if (unknownCurrentBatchFatBlock) unknownCurrentBatchFatBlock.style.display = 'none';
      standardResultsBlock.style.display = 'block';
      document.getElementById('standardFatAnalysisBlock').style.display = 'block';

      const missingReprocessKg = parseNum(document.getElementById('missingReprocessKg').value);
      const reprocessFat = parseNum(document.getElementById('reprocessFat').value);

      if (inputBatchSize > 0 && targetFat > 0 && missingReprocessKg > 0 && reprocessFat > 0 && effectiveCreamFat > targetFat) {
        const missingFatKg = (missingReprocessKg * reprocessFat) / 100;
        const actualTotal = inputBatchSize - missingReprocessKg;
        computedActualTotal = actualTotal;

        const pureCreamNeeded = missingFatKg / (effectiveCreamFat / 100);
        let rawWaterNeeded = missingReprocessKg - pureCreamNeeded;

        let extraCreamForExcessWater = 0;

        if (useWaterFlush && waterFlushKg > 0) {
          if (waterFlushKg > rawWaterNeeded) {
            const excessWater = waterFlushKg - rawWaterNeeded;
            extraCreamForExcessWater = (excessWater * targetFat) / (effectiveCreamFat - targetFat);
            addAmount = pureCreamNeeded + extraCreamForExcessWater + waterFlushKg;
            waterToAdd = 0;
          } else {
            addAmount = pureCreamNeeded + waterFlushKg;
            waterToAdd = rawWaterNeeded - waterFlushKg;
          }
        } else {
          addAmount = pureCreamNeeded;
          waterToAdd = rawWaterNeeded;
        }

        if (waterToAdd < 0) waterToAdd = 0;

        const currentFatInTank = (inputBatchSize * targetFat / 100) - missingFatKg;

        actualBatchValueEl.innerText = Math.round(computedActualTotal) + ' kg';
        detailsEl.innerHTML = `
          <div class="calc-step">
            <strong>Analyse van de ontbrekende herverwerking:</strong><br>
            • Geplande batchgrootte: <strong>${inputBatchSize} kg</strong><br>
            • Ontbrekende herverwerking: <strong>${missingReprocessKg} kg</strong> (gepland op ${reprocessFat.toFixed(2)}% vet)<br>
            • Aanwezige massa in tank: <strong>${Math.round(actualTotal)} kg</strong> (bevat ${currentFatInTank.toFixed(2)} kg vet)<br>
            • Ontbrekende vetmassa: <strong>${missingFatKg.toFixed(2)} kg vet</strong>
          </div>`;

        rowAddIngredient.style.display = 'flex';
        if (waterFlushToggleContainer) waterFlushToggleContainer.style.display = 'flex';
        if (addTooltipIcon) addTooltipIcon.style.display = 'inline-flex';
        rowAddWater.style.display = waterToAdd > 0 ? 'flex' : 'none';
        holdWaterBlock.style.display = 'none';

        const finalTotalBatch = actualTotal + addAmount + waterToAdd;
        const targetFatKg = (finalTotalBatch * targetFat) / 100;
        
        document.getElementById('currentFatKgStandardVal').innerText = currentFatInTank.toFixed(2) + ' kg';
        document.getElementById('targetFatKgVal').innerText = targetFatKg.toFixed(2) + ' kg';
        
        const diffFatEl = document.getElementById('diffFatKgVal');
        diffFatEl.innerText = '-' + missingFatKg.toFixed(2) + ' kg';
        diffFatEl.style.color = '#c0392b';

        stepsHtml = `
          <div class="calc-step">
            <strong>Stap 1: Analyse ontbrekende herverwerking</strong><br>
            De ontbrekende <strong>${missingReprocessKg} kg</strong> herverwerking bevat volgens receptuur <strong>${missingFatKg.toFixed(2)} kg vet</strong>.
          </div>
          <div class="calc-step">
            <strong>Stap 2: Bepaling dosering room en water</strong><br>
            • Benodigde zuivere room (voor vetmassa): <strong>${Math.round(pureCreamNeeded)} kg</strong><br>
            • Aanvankelijk op te vullen watermassa: <strong>${Math.round(rawWaterNeeded)} kg</strong><br>
            ${useWaterFlush ? (waterFlushKg > rawWaterNeeded ? 
              `• ⚠️ <strong>Waterinspoel correctie:</strong> De ingestelde waterinspoel (<strong>${waterFlushKg} kg</strong>) is groter dan het op te vullen water (${Math.round(rawWaterNeeded)} kg). Er komt <strong>${Math.round(waterFlushKg - rawWaterNeeded)} kg extra water</strong> in de mix.<br>
              • Om het doelvetgehalte van <strong>${targetFat.toFixed(2)}%</strong> te behouden, is er automatisch <strong>${Math.round(extraCreamForExcessWater)} kg extra room</strong> toegevoegd.<br>
              • Totale roomdosering (incl. inspoel): <strong>${Math.round(addAmount)} kg</strong><br>
              • Toe te voegen extra water: <strong>0 kg</strong>` : 
              `• Inclusief <strong>${waterFlushKg} kg waterinspoel</strong> bedraagt de totale roomdosering: <strong>${Math.round(addAmount)} kg</strong><br>
              • Resterend toe te voegen water: <strong>${Math.round(waterToAdd)} kg</strong>`) : 
              `• Aanvullend water (om de massa op te vullen): <strong>${Math.round(waterToAdd)} kg</strong>`}
            <br>👉 <strong>Dosering: Voeg ${Math.round(addAmount)} kg room ${useWaterFlush ? '(incl. ' + waterFlushKg + ' kg waterinspoel) ' : ''}${waterToAdd > 0 ? 'én ' + Math.round(waterToAdd) + ' kg water' : ''} toe.</strong>
          </div>
          <div class="calc-step">
            <strong>Stap 3: Resultaat na toevoeging</strong><br>
            • Aanwezige inhoud: <strong>${Math.round(actualTotal)} kg</strong><br>
            • Toegevoegd (room + water): <strong>${Math.round(addAmount + waterToAdd)} kg</strong><br>
            • Totale nieuwe batchgrootte: <strong>${Math.round(finalTotalBatch)} kg</strong>
          </div>`;

        document.getElementById('addValue').innerText = Math.round(addAmount) + ' kg';
        document.getElementById('waterToAdd').innerText = Math.round(waterToAdd) + ' kg';
        document.getElementById('totalBatch').innerText = Math.round(finalTotalBatch) + ' kg';
        document.getElementById('calcSteps').innerHTML = stepsHtml;
        
        updateExtraParametersResults(actualTotal, currentFatInTank, addAmount, waterToAdd, finalTotalBatch, inputDS, inputProtein, inputSucrose, additionType, effectiveCreamFat, targetFat);
        return;
      } else if (effectiveCreamFat <= targetFat && effectiveCreamFat > 0) {
        errorSection.innerHTML = `<div class="error-box"><strong>⚠️ Ongeldig vetgehalte!</strong><br>Room vetgehalte (${effectiveCreamFat.toFixed(2)}%) moet hoger zijn dan gewenst vetgehalte (${targetFat.toFixed(2)}%).</div>`;
        return;
      }
    }

    if (unknownCurrentBatchFatBlock) {
      unknownCurrentBatchFatBlock.style.display = 'none';
    }

    // Berekening actuele tankinhoud (werkt nu ook voor 'unknown')
    if (!isReprocess && inputBatchSize > 0 && currentFat > 0 && targetFat > 0 && (effectiveCreamFat > 0 || missingComponent.startsWith('water'))) {
      let calcCreamFat = (missingComponent.startsWith('water') && effectiveCreamFat === 0) ? 43 : effectiveCreamFat;
      let actualTotal = 0, actualIngredient = 0, actualWater = 0;

      const plannedWater = inputBatchSize - (((inputBatchSize * targetFat) / 100) / calcCreamFat) * 100;
      
      if (['cream_less', 'cream_more', 'fat_less', 'fat_more'].includes(missingComponent)) {
        actualWater = plannedWater;
        actualTotal = actualWater / (1 - (currentFat / calcCreamFat));
        actualIngredient = actualTotal - actualWater;
      } else {
        // water_more én unknown vallen nu in deze berekening
        actualIngredient = (((inputBatchSize * targetFat) / 100) / calcCreamFat) * 100;
        actualTotal = ((actualIngredient * calcCreamFat) / 100) / (currentFat / 100);
        actualWater = actualTotal - actualIngredient;
      }
      computedActualTotal = actualTotal;

      const diffTotal = actualTotal - inputBatchSize;
      const ingredName = additionType === 'fat' ? 'vloeibaar vet' : 'room';

      detailsEl.innerHTML = `
        <div class="calc-step">
          <strong>Analyse van de actuele tankinhoud:</strong><br>
          • Geplande batchgrootte: <strong>${inputBatchSize} kg</strong><br>
          • Berekende werkelijke inhoud: <strong>${Math.round(actualTotal)} kg</strong> (${diffTotal > 0 ? '+' + Math.round(diffTotal) + ' kg afwijking' : Math.round(diffTotal) + ' kg afwijking'})<br>
          • Samenstelling Huidige Tank: <strong>${Math.round(actualIngredient)} kg</strong> ${ingredName} en <strong>${Math.round(actualWater)} kg</strong> water.
        </div>`;
      actualBatchValueEl.innerText = Math.round(computedActualTotal) + ' kg';
    } else if (!isReprocess) {
      computedActualTotal = 0;
      actualBatchValueEl.innerText = '0 kg';
      detailsEl.innerHTML = '<p style="margin:0; font-style:italic; color:#666;">Vul de vereiste velden in en klik op "Bereken correctie".</p>';
    }

    const activeBatchSize = (!isReprocess && computedActualTotal > 0) ? computedActualTotal : inputBatchSize;
    const isMoreCause = ['cream_more', 'fat_more', 'water_less'].includes(missingComponent);
    const isLessCause = ['cream_less', 'fat_less', 'water_more'].includes(missingComponent);

    if (inputBatchSize > 0 && targetFat > 0 && !isReprocess && !isUnknown) {
      if (isMoreCause && currentFat < targetFat) {
        hasError = true;
        errorSection.innerHTML = `<div class="error-box"><strong>⚠️ Onmogelijke combinatie!</strong><br>Gemeten vetgehalte (${currentFat.toFixed(2)}%) is te laag voor deze oorzaak. Moet hoger zijn dan ${targetFat.toFixed(2)}%.</div>`;
      } else if (isLessCause && currentFat > targetFat) {
        hasError = true;
        errorSection.innerHTML = `<div class="error-box"><strong>⚠️ Onmogelijke combinatie!</strong><br>Gemeten vetgehalte (${currentFat.toFixed(2)}%) is te hoog voor deze oorzaak. Moet lager zijn dan ${targetFat.toFixed(2)}%.</div>`;
      } else if (currentFat < targetFat && additionType === 'cream' && effectiveCreamFat <= targetFat && effectiveCreamFat > 0) {
        hasError = true;
        errorSection.innerHTML = `<div class="error-box"><strong>⚠️ Ongeldig vetgehalte!</strong><br>Room vetgehalte (${effectiveCreamFat.toFixed(2)}%) moet hoger zijn dan gewenst vetgehalte (${targetFat.toFixed(2)}%).</div>`;
      } else {
        errorSection.innerHTML = '';
      }
    } else {
      errorSection.innerHTML = '';
    }

    if (!hasError && activeBatchSize > 0 && targetFat > 0) {
      if (currentFat < targetFat && !isReprocess) {
        if (additionType === 'cream' && effectiveCreamFat > targetFat) {
          if (useWaterFlush && waterFlushKg > 0) {
            addAmount = ((targetFat - currentFat) * activeBatchSize + waterFlushKg * targetFat) / (effectiveCreamFat - targetFat) + waterFlushKg;
          } else {
            addAmount = ((targetFat - currentFat) / (effectiveCreamFat - targetFat)) * activeBatchSize;
          }
        } else if (additionType === 'fat') {
          addAmount = ((targetFat - currentFat) / (100 - targetFat)) * activeBatchSize;
        }
      } else if (currentFat > targetFat && !isReprocess) {
        waterToAdd = ((currentFat / targetFat) - 1) * activeBatchSize;
      }
    }

    const finalBatchSizeStandard = activeBatchSize + addAmount + waterToAdd;

    let currentFatKg = 0, targetFatCurrentBatchKg = 0, diffFatCurrentBatchKg = 0;
    let targetFatKgStandard = 0, diffFatKgStandard = 0;

    if (activeBatchSize > 0 && targetFat > 0) {
      currentFatKg = (activeBatchSize * currentFat) / 100;
      targetFatCurrentBatchKg = (activeBatchSize * targetFat) / 100;
      diffFatCurrentBatchKg = currentFatKg - targetFatCurrentBatchKg;
      
      targetFatKgStandard = (finalBatchSizeStandard * targetFat) / 100;
      
      if (missingComponent === 'water_less') {
        diffFatKgStandard = 0;
      } else {
        diffFatKgStandard = currentFatKg - targetFatKgStandard;
      }
    }

    document.getElementById('currentFatKgVal').innerText = currentFatKg > 0 ? (currentFatKg.toFixed(2) + ' kg') : '0 kg';
    document.getElementById('currentFatKgStandardVal').innerText = currentFatKg > 0 ? (currentFatKg.toFixed(2) + ' kg') : '0 kg';
    document.getElementById('targetFatCurrentBatchKgVal').innerText = targetFatCurrentBatchKg > 0 ? (targetFatCurrentBatchKg.toFixed(2) + ' kg') : '0 kg';
    
    const diffCurrentEl = document.getElementById('diffFatCurrentBatchKgVal');
    if (diffFatCurrentBatchKg < 0) {
      diffCurrentEl.innerText = diffFatCurrentBatchKg.toFixed(2) + ' kg';
      diffCurrentEl.style.color = '#c0392b';
    } else if (diffFatCurrentBatchKg > 0) {
      diffCurrentEl.innerText = '+' + diffFatCurrentBatchKg.toFixed(2) + ' kg';
      diffCurrentEl.style.color = '#27ae60';
    } else {
      diffCurrentEl.innerText = '0.00 kg';
      diffCurrentEl.style.color = 'var(--primary)';
    }

    const standardFatBlock = document.getElementById('standardFatAnalysisBlock');

    if (addTooltipIcon) addTooltipIcon.style.display = (additionType === 'cream' || (missingComponent === 'water_more' && waterMoreIngredient === 'cream') || (missingComponent === 'unknown' && unknownIngredient === 'cream')) ? 'inline-flex' : 'none';

    if (!hasError && activeBatchSize > 0) {
      if (targetFat > currentFat && !isReprocess) {
        standardFatBlock.style.display = 'block';

        document.getElementById('targetFatKgVal').innerText = targetFatKgStandard.toFixed(2) + ' kg';
        
        const diffFatEl = document.getElementById('diffFatKgVal');
        if (diffFatKgStandard < 0) {
          diffFatEl.innerText = diffFatKgStandard.toFixed(2) + ' kg';
          diffFatEl.style.color = '#c0392b';
        } else if (diffFatKgStandard > 0) {
          diffFatEl.innerText = '+' + diffFatKgStandard.toFixed(2) + ' kg';
          diffFatEl.style.color = '#27ae60';
        } else {
          diffFatEl.innerText = '0.00 kg';
          diffFatEl.style.color = 'var(--primary)';
        }

        standardResultsBlock.style.display = 'block';
        rowAddIngredient.style.display = 'flex';
        
        if (waterFlushToggleContainer) waterFlushToggleContainer.style.display = (additionType === 'cream') ? 'flex' : 'none';
        rowAddWater.style.display = 'none';
        
        const hideHoldWaterCauses = ['cream_less', 'fat_less', 'reprocess_missing'];
        holdWaterBlock.style.display = hideHoldWaterCauses.includes(missingComponent) ? 'none' : 'block';

        const uncorrectedDiffFat = ((activeBatchSize * targetFat) / 100) - currentFatKg;
        waterToHoldNext = Math.abs(uncorrectedDiffFat) / (targetFat / 100);

        if (effectiveCreamFat > targetFat || additionType === 'fat') {
          const effectiveFatWithFlush = (addAmount > 0 && useWaterFlush && additionType === 'cream') ? (((addAmount - waterFlushKg) * effectiveCreamFat) / addAmount).toFixed(2) : effectiveCreamFat.toFixed(2);

          stepsHtml = `
            <div class="calc-step">
              <strong>Stap 1: Huidige vs. verwachte situatie na correctie</strong><br>
              • Huidige tankinhoud: <strong>${Math.round(activeBatchSize)} kg</strong> met <strong>${currentFat.toFixed(2)}%</strong> vet = <strong>${currentFatKg.toFixed(2)} kg vet</strong><br>
              • Doel vetgehalte na correctie: <strong>${targetFat.toFixed(2)}%</strong><br>
              • Benodigd vet na toevoeging: <strong>${targetFatKgStandard.toFixed(2)} kg vet</strong><br>
              • Extra toe te voegen vetmassa: <strong>${Math.abs(diffFatKgStandard).toFixed(2)} kg vet</strong>
            </div>
            <div class="calc-step">
              <strong>Stap 2: Bepaling dosering ${ingredientName}</strong><br>
              ${useWaterFlush && additionType === 'cream' ? 
                `• Basisdosering room voor vettekort: <strong>${Math.round(((targetFat - currentFat) / (effectiveCreamFat - targetFat)) * activeBatchSize)} kg</strong><br>
                • Extra room gecompenseerd voor <strong>${waterFlushKg} kg waterinspoel</strong>: <strong>${Math.round(addAmount - ((targetFat - currentFat) / (effectiveCreamFat - targetFat)) * activeBatchSize - waterFlushKg)} kg</strong><br>
                • Effectief vetgehalte van room inclusief waterinspoel: <strong>${effectiveFatWithFlush}%</strong><br>
                👉 <strong>Totale dosering room (incl. inspoel): ${Math.round(addAmount)} kg</strong>` : 
                `• Formule: <span class="calc-formula">(${targetFat.toFixed(2)} - ${currentFat.toFixed(2)}) / (${effectiveCreamFat.toFixed(2)} - ${targetFat.toFixed(2)}) × ${Math.round(activeBatchSize)}</span><br>
                👉 <strong>Totale dosering ${ingredientName}: ${Math.round(addAmount)} kg</strong>`}
            </div>
            <div class="calc-step">
              <strong>Stap 3: Nieuwe totaalbalans van de batch</strong><br>
              • Oude tankinhoud: <strong>${Math.round(activeBatchSize)} kg</strong><br>
              • Toegevoegd: <strong>+${Math.round(addAmount)} kg</strong> ${ingredientName}<br>
              • Nieuwe batchgrootte: <strong>${Math.round(finalBatchSizeStandard)} kg</strong><br>
              • Nieuw berekend vetgehalte: <strong>${targetFat.toFixed(2)}%</strong>
            </div>`;
        }
      } else if (currentFat > targetFat && !isReprocess) {
        standardFatBlock.style.display = 'block';

        document.getElementById('targetFatKgVal').innerText = targetFatKgStandard.toFixed(2) + ' kg';
        
        const diffFatEl = document.getElementById('diffFatKgVal');
        if (diffFatKgStandard < 0) {
          diffFatEl.innerText = diffFatKgStandard.toFixed(2) + ' kg';
          diffFatEl.style.color = '#c0392b';
        } else if (diffFatKgStandard > 0) {
          diffFatEl.innerText = '+' + diffFatKgStandard.toFixed(2) + ' kg';
          diffFatEl.style.color = '#27ae60';
        } else {
          diffFatEl.innerText = '0.00 kg';
          diffFatEl.style.color = 'var(--primary)';
        }

        standardResultsBlock.style.display = 'block';
        rowAddIngredient.style.display = 'none';
        if (waterFlushToggleContainer) waterFlushToggleContainer.style.display = 'none';
        rowAddWater.style.display = 'flex';
        holdWaterBlock.style.display = 'none';

        stepsHtml = `
          <div class="calc-step">
            <strong>Stap 1: Huidige vs. verwachte situatie na correctie</strong><br>
            • Huidige tankinhoud: <strong>${Math.round(activeBatchSize)} kg</strong> met <strong>${currentFat.toFixed(2)}%</strong> vet = <strong>${currentFatKg.toFixed(2)} kg vet</strong><br>
            • Doel vetgehalte: <strong>${targetFat.toFixed(2)}%</strong><br>
            • Benodigd vet na verdunning: <strong>${targetFatKgStandard.toFixed(2)} kg vet</strong> (geen vetverlies)
          </div>
          <div class="calc-step">
            <strong>Stap 2: Bepaling waterdosering</strong><br>
            • Formule verdunning: <span class="calc-formula">(Gemeten vet / Doel vet - 1) × Tankinhoud</span><br>
            • Berekening: <span class="calc-formula">(${currentFat.toFixed(2)} / ${targetFat.toFixed(2)} - 1) × ${Math.round(activeBatchSize)}</span><br>
            👉 <strong>Toe te voegen water: ${Math.round(waterToAdd)} kg</strong>
          </div>
          <div class="calc-step">
            <strong>Stap 3: Nieuwe totaalbalans van de batch</strong><br>
            • Oude tankinhoud: <strong>${Math.round(activeBatchSize)} kg</strong><br>
            • Toegevoegd water: <strong>+${Math.round(waterToAdd)} kg</strong><br>
            • Nieuwe batchgrootte: <strong>${Math.round(finalBatchSizeStandard)} kg</strong><br>
            • Nieuw berekend vetgehalte: <strong>${targetFat.toFixed(2)}%</strong>
          </div>`;
      } else if (currentFat === targetFat && targetFat > 0) {
        standardFatBlock.style.display = 'block';

        document.getElementById('targetFatKgVal').innerText = targetFatKgStandard.toFixed(2) + ' kg';
        
        const diffFatEl = document.getElementById('diffFatKgVal');
        diffFatEl.innerText = '0.00 kg';
        diffFatEl.style.color = 'var(--primary)';

        standardResultsBlock.style.display = 'block';
        rowAddIngredient.style.display = 'none';
        if (waterFlushToggleContainer) waterFlushToggleContainer.style.display = 'none';
        rowAddWater.style.display = 'none';
        holdWaterBlock.style.display = 'none';

        stepsHtml = `<div class="calc-step"><strong>✅ Het gemeten vetgehalte (${currentFat.toFixed(2)}%) is exact gelijk aan het doelvetgehalte. Er is geen correctie nodig.</strong></div>`;
      }

      document.getElementById('addValue').innerText = Math.round(addAmount) + ' kg';
      document.getElementById('waterToAdd').innerText = Math.round(waterToAdd) + ' kg';
      document.getElementById('waterToHoldNextBatch').innerText = Math.round(waterToHoldNext) + ' kg';
      document.getElementById('totalBatch').innerText = Math.round(finalBatchSizeStandard) + ' kg';
      document.getElementById('calcSteps').innerHTML = stepsHtml;

      updateExtraParametersResults(activeBatchSize, currentFatKg, addAmount, waterToAdd, finalBatchSizeStandard, inputDS, inputProtein, inputSucrose, additionType, effectiveCreamFat, targetFat);
    } else {
      standardResultsBlock.style.display = 'none';
      standardFatBlock.style.display = 'none';
      if (unknownCurrentBatchFatBlock) unknownCurrentBatchFatBlock.style.display = 'none';
      document.getElementById('extraParametersResultBlock').style.display = 'none';
    }
  }

  window.addEventListener('load', () => {
    loadSettings();
    updateDateInformation();
    onCauseChange();
    calculateEvap();
    generateCodes();

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosInstruction = document.getElementById('iosInstruction');

    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

    if (isStandalone) {
      if (installBtn) installBtn.style.display = 'none';
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'inline-flex';
      });

      if (installBtn) {
        installBtn.addEventListener('click', () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
              deferredPrompt = null;
              installBtn.style.display = 'none';
            });
          } else if (isIos) {
            if (iosInstruction) {
              iosInstruction.style.display = iosInstruction.style.display === 'block' ? 'none' : 'block';
            }
          } else {
            alert("App installatie: gebruik het menu van je browser en kies 'Toevoegen aan startscherm'.");
          }
        });
      }
    }
  });
</script>
